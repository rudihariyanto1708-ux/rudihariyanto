<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Detail Produk — SHEILA STORE</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header small">
    <div class="header-inner">
      <div class="logo">SHEILA <span class="accent">STORE</span></div>
      <nav>
        <a href="index.html">Home</a>
        <a href="katalog.html">Katalog</a>
      </nav>
    </div>
  </header>

  <main class="detail-wrap maxwidth" id="detail">
    <section class="detail-card">
      <figure class="detail-media">
        <img id="product-image" src="img/ring1.jpg" alt="produk">
      </figure>

      <section class="detail-info">
        <h1 id="product-name">Nama Produk</h1>
        <div id="product-price" class="price">Rp 0</div>
        <p id="product-desc" class="desc">Deskripsi singkat produk akan muncul di sini.</p>

        <div class="detail-actions">
          <a id="buy-now" href="#" class="btn-primary">Beli Sekarang</a>
          <a class="btn-ghost" href="katalog.html">Kembali</a>
        </div>
      </section>
    </section>
  </main>

  <!-- popup akan dibuat oleh script.js -->

  <footer class="site-footer small">
    <div class="footer-line"></div>
    <div class="footer-inner maxwidth">
      <div class="footer-brand">SHEILA <span class="accent">STORE</span></div>
      <div class="footer-contacts">
        <a id="wa-footer-3" href="#" target="_blank" rel="noreferrer">WhatsApp</a>
        <span class="sep">|</span>
        <a id="ig-footer-3" href="#" target="_blank" rel="noreferrer">Instagram</a>
        <span class="sep">|</span>
        <a id="email-footer-3" href="#" target="_blank" rel="noreferrer">Email</a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
