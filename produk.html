<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Detail Produk — SHEILA STORE</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header small">
    <div class="header-inner">
      <div class="logo">SHEILA <span class="accent">STORE</span></div>
      <nav>
        <a href="index.html">Home</a>
        <a href="katalog.html">Katalog</a>
      </nav>
    </div>
  </header>

  <main class="detail-wrap" id="detail">
    <section class="detail-card">
      <figure class="detail-media">
        <img id="product-image" src="img/produk1.jpg" alt="produk">
      </figure>

      <section class="detail-info">
        <h1 id="product-name">Nama Produk</h1>
        <div id="product-price" class="price">Rp 0</div>
        <p id="product-desc" class="desc">Deskripsi singkat produk akan muncul di sini.</p>

        <div class="detail-actions">
          <a id="buy-now" href="#" class="btn-primary">Beli Sekarang</a>
          <a class="btn-ghost" href="katalog.html">Kembali</a>
        </div>
      </section>
    </section>
  </main>

  <!-- Popup Form (isi dengan script.js) -->
  <!-- file script.js akan mengisi dan meng-handle popup -->

  <footer class="site-footer small">
    <div class="footer-line"></div>
    <div class="footer-inner">
      <div class="footer-brand">
        <div>SHEILA <span class="accent">STORE</span></div>
        <div class="footer-small">Elegance • Minimal • Professional</div>
      </div>

      <div class="footer-contacts">
        <a id="wa-footer-2" href="#" target="_blank" rel="noreferrer">WhatsApp</a>
        <span class="sep">|</span>
        <a id="ig-footer-2" href="#" target="_blank" rel="noreferrer">Instagram</a>
        <span class="sep">|</span>
        <a id="email-footer-2" href="#" target="_blank" rel="noreferrer">Email</a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
