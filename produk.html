<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Produk — SHEILA PUTRI STORE</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar center">
    <div class="brand">
      <span class="brand-large">SHEILA PUTRI</span>
      <span class="brand-small">STORE</span>
    </div>
  </header>

  <main class="container detail-wrap">
    <section class="detail-card">
      <div class="gallery">
        <button class="gnav left" id="prevBtn" aria-label="Previous image">‹</button>
        <div class="gallery-main">
          <img id="galleryImage" src="img/ring1.jpg" alt="">
        </div>
        <button class="gnav right" id="nextBtn" aria-label="Next image">›</button>

        <div class="thumbnails" id="thumbs"></div>
      </div>

      <section class="detail-info">
        <h1 id="product-name">Nama Produk</h1>
        <div id="product-price" class="price">Rp 0</div>
        <p id="product-desc" class="desc">Deskripsi produk akan muncul di sini.</p>

        <div class="detail-actions">
          <button id="buy-now" class="btn primary">Beli Sekarang</button>
          <a href="katalog.html" class="btn ghost">Kembali</a>
        </div>
      </section>
    </section>
  </main>

  <!-- popup form generated by script.js -->

  <footer class="footer-minimal">
    <p>✨ Handmade Beads Jewelry — Crafted with Love ✨</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
