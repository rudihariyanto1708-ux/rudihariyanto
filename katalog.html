<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koleksi — SHEILA PUTRI STORE</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar center">
    <div class="brand">
      <span class="brand-large">SHEILA PUTRI</span>
      <span class="brand-small">STORE</span>
    </div>
  </header>

  <section class="section-intro">
    <div class="container">
      <h2 class="section-title">Koleksi Cincin & Gelang</h2>
    </div>
  </section>

  <main class="container catalog-grid">
    <!-- Cincin (kirim beberapa gambar sebagai parameter 'imgs' dipisah koma) -->
    <article class="card" onclick="openProductMulti(['img/CINCIN1.jpeg','img/CINCIN2.jpeg',],'Cincin','15000','Cincin manik-manik kombinasi mutiara & kristal — ukuran S/M')">
      <div class="card-media"><img src="img/CINCIN1.jpeg" alt="Cincin Aurora"></div>
      <div class="card-body">
        <div class="product-name">Cincin </div>
      </div>
    </article>

    <!-- Gelang -->
    <article class="card" onclick="openProductMulti(['img/GELANG1.jpeg','img/GELANG2.jpeg'],'Gelang','15000','Gelang manik-manik pastel — ringan & nyaman')">
      <div class="card-media"><img src="img/GELANG1.jpeg" alt="Gelang Lila"></div>
      <div class="card-body">
        <div class="product-name">Gelang </div>
      </div>
    </article>

    <!-- Tambah produk lain: copy article dan ubah argumen openProductMulti -->
  </main>

  <footer class="footer-minimal">
    <p>✨ Handmade Beads Jewelry — Crafted with Love ✨</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
