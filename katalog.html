<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Koleksi — SHEILA STORE</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">SHEILA <span class="accent">STORE</span></div>
      <nav>
        <a href="index.html">Home</a>
        <a class="active" href="katalog.html">Katalog</a>
        <a href="#kontak">Kontak</a>
      </nav>
    </div>
  </header>

  <section class="section-intro">
    <div class="maxwidth">
      <h2 class="section-title">Koleksi Manik-Manik</h2>
      <p class="section-sub">Cincin & gelang handcrafted — dipilih bahan berkualitas dan finishing halus.</p>
    </div>
  </section>

  <main class="catalog-grid maxwidth" aria-live="polite">
    <!-- contoh produk: ganti gambar & data sesuai kebutuhan -->
    <article class="card" onclick="openProduct('img/ring1.jpg','Cincin Aurora','129000','Cincin manik-manik dengan kombinasi mutiara dan kristal. Ukuran S-M.')">
      <div class="card-media"><img src="img/ring1.jpg" alt="Cincin Aurora"></div>
      <div class="card-body">
        <div class="product-name">Cincin Aurora</div>
        <div class="product-price">Rp 129.000</div>
      </div>
    </article>

    <article class="card" onclick="openProduct('img/bracelet1.jpg','Gelang Lila','89000','Gelang manik-manik pastel, sangat ringan dan nyaman dipakai.')">
      <div class="card-media"><img src="img/bracelet1.jpg" alt="Gelang Lila"></div>
      <div class="card-body">
        <div class="product-name">Gelang Lila</div>
        <div class="product-price">Rp 89.000</div>
      </div>
    </article>

    <article class="card" onclick="openProduct('img/ring2.jpg','Cincin Pearl','149000','Cincin kombinasi manik kaca dan mutiara air tawar — elegan.')">
      <div class="card-media"><img src="img/ring2.jpg" alt="Cincin Pearl"></div>
      <div class="card-body">
        <div class="product-name">Cincin Pearl</div>
        <div class="product-price">Rp 149.000</div>
      </div>
    </article>

    <article class="card" onclick="openProduct('img/bracelet2.jpg','Gelang Aurora','99000','Gelang double strand beraksen emas lembut.')">
      <div class="card-media"><img src="img/bracelet2.jpg" alt="Gelang Aurora"></div>
      <div class="card-body">
        <div class="product-name">Gelang Aurora</div>
        <div class="product-price">Rp 99.000</div>
      </div>
    </article>

    <!-- tambahkan produk lain dengan menyalin blok artikel di atas -->
  </main>

  <footer id="kontak" class="site-footer">
    <div class="footer-line"></div>
    <div class="footer-inner maxwidth">
      <div class="footer-brand">SHEILA <span class="accent">STORE</span></div>
      <div class="footer-contacts">
        <a id="wa-footer-2" href="#" target="_blank" rel="noreferrer">WhatsApp</a>
        <span class="sep">|</span>
        <a id="ig-footer-2" href="#" target="_blank" rel="noreferrer">Instagram</a>
        <span class="sep">|</span>
        <a id="email-footer-2" href="#" target="_blank" rel="noreferrer">Email</a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
