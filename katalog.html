<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Koleksi — SHEILA STORE</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar center">
    <div class="brand">
      <span class="brand-large">SHEILA</span>
      <span class="brand-small">STORE</span>
    </div>
  </header>

  <section class="section-intro">
    <div class="container">
      <h2 class="section-title">Koleksi Cincin & Gelang</h2>
      <p class="section-sub">Pilih kategori — tap produk untuk melihat varian foto dan detail.</p>
    </div>
  </section>

  <main class="container catalog-grid">
    <!-- Cincin (kirim beberapa gambar sebagai parameter 'imgs' dipisah koma) -->
    <article class="card" onclick="openProductMulti(['img/ring1.jpg','img/ring2.jpg','img/ring3.jpg'],'Cincin','129000','Cincin manik-manik kombinasi mutiara & kristal — ukuran S/M')">
      <div class="card-media"><img src="img/ring1.jpg" alt="Cincin Aurora"></div>
      <div class="card-body">
        <div class="product-name">Cincin </div>
      </div>
    </article>

    <!-- Gelang -->
    <article class="card" onclick="openProductMulti(['img/bracelet1.jpg','img/bracelet2.jpg','img/bracelet3.jpg'],'Gelang','89000','Gelang manik-manik pastel — ringan & nyaman')">
      <div class="card-media"><img src="img/bracelet1.jpg" alt="Gelang Lila"></div>
      <div class="card-body">
        <div class="product-name">Gelang </div>
      </div>
    </article>

    <!-- Tambah produk lain: copy article dan ubah argumen openProductMulti -->
  </main>

  <footer class="footer-minimal">
    <p>✨ Handmade Beads Jewelry — Crafted with Love ✨</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
